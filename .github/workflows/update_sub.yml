name: Update Gist
on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Process configs
        run: |
          # Получаем чистые VLESS ссылки (без base64)
          curl -k -H "Authorization: token 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" \
               -L "https://raw.githubusercontent.com/Roadlux/PacketVPN1.5.3-NEW/main/configInfo" \
               | jq -r '.configs[].config.stringServer' > sub.txt

      - name: Update Gist via API
        env:
          GIST_TOKEN: ${{ secrets.PACKETTOKEN }}
          GIST_ID: 5d53a0965ad16d964c5fb366e11532ff
        run: |
          # Экранируем содержимое для отправки в JSON
          CONTENT=$(cat sub.txt | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          echo "{\"files\": {\"sub.txt\": {\"content\": \"$CONTENT\"}}}" > payload.json
          
          curl -L -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d @payload.json \
            https://api.github.com/gists/$GIST_ID
            
